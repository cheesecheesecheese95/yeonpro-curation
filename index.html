<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>연프 어디까지 봤니?</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0A0A0A;--surface:#161616;--surface2:#222;--surface3:#2E2E2E;
  --text:#F5F5F5;--text2:#AAA;--text3:#666;
  --radius:14px;--max-w:480px;
  --solo:#FF6B35;--heart:#FF2D55;--nasol:#C0392B;--hwan:#8E44AD;
}
html,body{font-family:-apple-system,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.app{max-width:var(--max-w);margin:0 auto;min-height:100vh;}

.header{position:sticky;top:0;z-index:100;background:rgba(10,10,10,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:14px 16px 0;}
.brand{font-size:16px;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:6px;}

/* Show Tabs */
.show-tabs{display:flex;border-bottom:2px solid var(--surface2);}
.show-tab{flex:1;padding:10px 0;text-align:center;font-size:11px;font-weight:700;color:var(--text3);cursor:pointer;border:none;background:none;font-family:inherit;position:relative;transition:color 0.2s;display:flex;flex-direction:column;align-items:center;gap:2px;}
.show-tab .icon{font-size:18px;}
.show-tab.active{color:var(--text);}
.show-tab.active::after{content:'';position:absolute;bottom:-2px;left:10%;width:80%;height:2.5px;border-radius:2px;}
.show-tab[data-s="솔로지옥"].active::after{background:var(--solo);}
.show-tab[data-s="하트시그널"].active::after{background:var(--heart);}
.show-tab[data-s="나는솔로"].active::after{background:var(--nasol);}
.show-tab[data-s="환승연애"].active::after{background:var(--hwan);}

/* Season chips */
.row{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 6px;-webkit-overflow-scrolling:touch;}
.row::-webkit-scrollbar{display:none;}
.chip{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;border:1px solid var(--surface2);background:var(--surface);color:var(--text2);transition:all 0.15s;flex-shrink:0;}
.chip.active{color:#fff;border-color:transparent;}

/* Episode grid */
.ep-section{padding:6px 16px 0;}
.ep-label{font-size:12px;font-weight:700;color:var(--text3);margin-bottom:8px;}
.ep-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.ep-btn{width:42px;height:36px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--surface2);background:var(--surface);color:var(--text2);font-family:inherit;transition:all 0.15s;display:flex;align-items:center;justify-content:center;}
.ep-btn.active{color:#fff;border-color:transparent;}
.ep-btn.has-content{border-color:var(--text3);}

/* Content type tabs */
.type-tabs{display:flex;gap:0;margin:0 16px 8px;border-radius:10px;overflow:hidden;border:1px solid var(--surface2);}
.type-tab{flex:1;padding:9px;text-align:center;font-size:12px;font-weight:700;color:var(--text3);cursor:pointer;border:none;background:var(--surface);font-family:inherit;transition:all 0.15s;}
.type-tab.active{background:var(--surface3);color:var(--text);}
.type-tab .cnt{font-size:10px;opacity:0.6;margin-left:3px;}

/* Video list */
.vlist{padding:0 16px 100px;}
.vcard{display:flex;gap:12px;background:var(--surface);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer;transition:transform 0.12s;}
.vcard:active{transform:scale(0.98);}
.vcard.watched{opacity:0.45;}
.vcard-thumb{position:relative;width:150px;height:84px;border-radius:8px;overflow:hidden;flex-shrink:0;background:#111;}
.vcard-thumb img{width:100%;height:100%;object-fit:cover;}
.vcard-dur{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,0.8);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;}
.vcard-rank{position:absolute;top:3px;left:3px;background:rgba(0,0,0,0.7);color:#fff;font-size:10px;font-weight:900;padding:1px 6px;border-radius:4px;}
.vcard-body{flex:1;min-width:0;display:flex;flex-direction:column;}
.vcard-title{font-size:12px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:auto;}
.vcard-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:10px;color:var(--text3);margin-top:6px;}
.vcard-watched-badge{color:#30D158;font-weight:700;}

/* Info bar */
.info-bar{padding:4px 16px 6px;display:flex;align-items:center;justify-content:space-between;}
.info-bar .cnt{font-size:12px;color:var(--text3);}
.info-bar .filter-btn{font-size:11px;color:var(--text2);background:var(--surface);border:1px solid var(--surface2);border-radius:8px;padding:4px 10px;cursor:pointer;font-family:inherit;}
.info-bar .filter-btn.active{color:#30D158;border-color:#30D158;}

/* Player */
.player{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.96);z-index:500;display:none;flex-direction:column;}
.player.active{display:flex;}
.player-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;}
.player-close{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;}
.player-frame{display:flex;align-items:center;justify-content:center;}
.player-frame iframe{width:100%;max-width:var(--max-w);aspect-ratio:16/9;border:none;border-radius:10px;}
.player-info{padding:14px 16px;overflow-y:auto;flex:1;}
.player-title{font-size:14px;font-weight:700;margin-bottom:4px;}
.player-meta{font-size:12px;color:var(--text2);margin-bottom:10px;}
.player-btn{padding:8px 16px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid #30D158;background:transparent;color:#30D158;font-family:inherit;margin-bottom:14px;transition:all 0.15s;}
.player-btn.done{background:#30D158;color:#000;}
.player-next-label{font-size:12px;font-weight:700;color:var(--text3);margin-bottom:8px;}
.player-next{display:flex;flex-direction:column;gap:6px;}
.pn-item{display:flex;gap:8px;padding:8px;background:var(--surface);border-radius:8px;cursor:pointer;}
.pn-item img{width:100px;height:56px;object-fit:cover;border-radius:5px;flex-shrink:0;}
.pn-item .t{font-size:11px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pn-item .m{font-size:10px;color:var(--text3);margin-top:2px;}

.empty{text-align:center;padding:40px 0;color:var(--text3);font-size:13px;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand">📺 연프 어디까지 봤니?</div>
    <div class="show-tabs">
      <button class="show-tab active" data-s="솔로지옥" onclick="setShow('솔로지옥')"><span class="icon">🏝️</span>솔로지옥</button>
      <button class="show-tab" data-s="하트시그널" onclick="setShow('하트시그널')"><span class="icon">💓</span>하트시그널</button>
      <button class="show-tab" data-s="나는솔로" onclick="setShow('나는솔로')"><span class="icon">🌹</span>나는솔로</button>
      <button class="show-tab" data-s="환승연애" onclick="setShow('환승연애')"><span class="icon">🔄</span>환승연애</button>
    </div>
  </div>

  <div class="row" id="season-row"></div>
  <div class="ep-section" id="ep-section" style="display:none;">
    <div class="ep-label">회차 선택</div>
    <div class="ep-grid" id="ep-grid"></div>
  </div>
  <div class="type-tabs" id="type-tabs">
    <button class="type-tab active" onclick="setType(this,'summary')">📝 요약<span class="cnt" id="cnt-summary"></span></button>
    <button class="type-tab" onclick="setType(this,'review')">💬 리뷰<span class="cnt" id="cnt-review"></span></button>
  </div>
  <div class="info-bar">
    <span class="cnt" id="count-info"></span>
    <button class="info-bar filter-btn" id="hide-watched" onclick="toggleHideWatched()">🙈 안 본 것만</button>
  </div>
  <div class="vlist" id="vlist"><div class="empty">로딩 중...</div></div>

  <div class="player" id="player">
    <div class="player-top">
      <button class="player-close" onclick="closePlayer()">✕</button>
      <span style="font-size:12px;color:var(--text3);" id="p-ch"></span>
    </div>
    <div class="player-frame">
      <iframe id="p-iframe" src="" allow="autoplay;encrypted-media" allowfullscreen></iframe>
    </div>
    <div class="player-info">
      <div class="player-title" id="p-title"></div>
      <div class="player-meta" id="p-meta"></div>
      <button class="player-btn" id="p-btn" onclick="toggleWatched()">👁 시청 완료</button>
      <div class="player-next-label">이 회차 다른 영상</div>
      <div class="player-next" id="p-next"></div>
    </div>
  </div>
</div>

<script>
let feed={shows:{}}, curShow='솔로지옥', curSeason=null, curEp=null, curType='summary', hideWatched=false, filtered=[], curVid=null;
const COLORS={솔로지옥:'#FF6B35',하트시그널:'#FF2D55',나는솔로:'#C0392B',환승연애:'#8E44AD'};

function fmt(n){if(n>=100000000)return(n/100000000).toFixed(1)+'억';if(n>=10000)return Math.round(n/10000)+'만';if(n>=1000)return Math.round(n/1000)+'천';return n+'';}
function fmtDur(s){if(!s)return'';const m=Math.floor(s/60);return m>60?Math.floor(m/60)+'시간 '+(m%60)+'분':m+'분';}
function getW(){try{return JSON.parse(localStorage.getItem('yp_w')||'{}');}catch{return{};}}
function isW(id){return!!getW()[id];}
function markW(id){const w=getW();w[id]=Date.now();localStorage.setItem('yp_w',JSON.stringify(w));}
function unmarkW(id){const w=getW();delete w[id];localStorage.setItem('yp_w',JSON.stringify(w));}

function seasonSort(a, b) {
  const na = parseInt(a.replace(/[^0-9]/g,'')) || 0;
  const nb = parseInt(b.replace(/[^0-9]/g,'')) || 0;
  return nb - na; // 최신 시즌 먼저
}

async function load(){
  try{
    const r=await fetch('data/feed.json?t='+Date.now());
    feed=await r.json();
    renderShow();
  }catch{document.getElementById('vlist').innerHTML='<div class="empty">데이터를 불러올 수 없습니다.</div>';}
}

function setShow(name){
  document.querySelectorAll('.show-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.show-tab[data-s="${name}"]`).classList.add('active');
  curShow=name; curSeason=null; curEp=null; curType='summary';
  document.querySelectorAll('.type-tab').forEach((t,i)=>t.classList.toggle('active',i===0));
  renderShow();
}

function renderShow(){
  const show=feed.shows[curShow];
  if(!show) return;
  const color=COLORS[curShow];

  // 시즌 목록
  const seasons = (show.seasons||[]).map(s=>s.season);
  if(!curSeason && seasons.length) curSeason=seasons[0]; // 최신 시즌 기본

  const el=document.getElementById('season-row');
  el.innerHTML = seasons.map((s,i) => {
    const act = s===curSeason;
    return `<div class="chip${act?' active':''}" style="${act?'background:'+color:''}" onclick="setSeason('${s}')">${s}</div>`;
  }).join('');

  renderEpisodes();
}

function setSeason(s){
  curSeason=s; curEp=null;
  const color=COLORS[curShow];
  document.querySelectorAll('#season-row .chip').forEach(c=>{
    const isMatch = s && c.textContent.startsWith(s);
    c.classList.toggle('active', isMatch);
    c.style.background = isMatch ? color : '';
  });
  renderEpisodes();
}

function renderEpisodes(){
  const show=feed.shows[curShow];
  if(!show) return;
  const color=COLORS[curShow];

  // 현재 시즌의 회차 목록
  const seasonVideos = curSeason ? show.videos.filter(v=>v.season===curSeason) : [];
  const eps = [...new Set(seasonVideos.filter(v=>v.episode).map(v=>v.episode))].sort((a,b)=>parseInt(a)-parseInt(b));

  const section=document.getElementById('ep-section');
  const grid=document.getElementById('ep-grid');

  if(eps.length > 0){
    section.style.display='';
    grid.innerHTML = eps.map(e=>{
        const act=curEp===e;
        return `<div class="ep-btn has-content${act?' active':''}" style="${act?'background:'+color:''}" onclick="setEp('${e}')">${e}</div>`;
      }).join('');
  } else {
    section.style.display='none';
  }

  apply();
}

function setEp(ep){
  curEp=ep;
  renderEpisodes();
}

function setType(el,type){
  document.querySelectorAll('.type-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  curType=type;
  apply();
}

function toggleHideWatched(){
  hideWatched=!hideWatched;
  document.getElementById('hide-watched').classList.toggle('active',hideWatched);
  apply();
}

function apply(){
  const show=feed.shows[curShow];
  if(!show) return;

  let items = curSeason ? show.videos.filter(v=>v.season===curSeason) : [...show.videos];
  if(curEp) items=items.filter(v=>v.episode===curEp);
  if(curType!=='all') items=items.filter(v=>v.content_type===curType);
  if(hideWatched) items=items.filter(v=>!isW(v.video_id));

  // 조회수순
  items.sort((a,b)=>b.view_count-a.view_count);
  filtered=items;

  // 타입별 카운트
  const allForCount = curSeason ? show.videos.filter(v=>v.season===curSeason&&(!curEp||v.episode===curEp)) : show.videos.filter(v=>!curEp||v.episode===curEp);
  document.getElementById('cnt-summary').textContent=allForCount.filter(v=>v.content_type==='summary').length||'';
  document.getElementById('cnt-review').textContent=allForCount.filter(v=>v.content_type==='review').length||'';

  const label=curEp?`${curSeason} ${curEp}화`:curSeason||'';
  document.getElementById('count-info').textContent=`${label} · ${items.length}개 영상`;
  render(items);
}

function render(items){
  const el=document.getElementById('vlist');
  if(!items.length){el.innerHTML='<div class="empty">영상이 없습니다</div>';return;}
  el.innerHTML=items.slice(0,60).map((v,i)=>{
    const w=isW(v.video_id);
    return `<div class="vcard${w?' watched':''}" onclick="play(${i})">
      <div class="vcard-thumb">
        <img src="${v.thumbnail_url||'https://img.youtube.com/vi/'+v.video_id+'/mqdefault.jpg'}" loading="lazy">
        <span class="vcard-dur">${fmtDur(v.duration_sec)}</span>
        <span class="vcard-rank">${i+1}</span>
      </div>
      <div class="vcard-body">
        <div class="vcard-title">${v.title}</div>
        <div class="vcard-meta">
          <span>${v.channel_name}</span>
          <span>▶ ${fmt(v.view_count)}</span>
          <span>♥ ${fmt(v.like_count)}</span>
          ${w?'<span class="vcard-watched-badge">✓ 봤어요</span>':''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function play(i){
  const v=filtered[i]; if(!v) return;
  curVid=v.video_id;
  document.getElementById('p-iframe').src=v.embed_url+'?autoplay=1';
  document.getElementById('p-title').textContent=v.title;
  document.getElementById('p-ch').textContent=v.channel_name;
  document.getElementById('p-meta').textContent=`조회수 ${fmt(v.view_count)} · ♥ ${fmt(v.like_count)} · ${fmtDur(v.duration_sec)}`;
  const wb=document.getElementById('p-btn');
  if(isW(v.video_id)){wb.textContent='✓ 시청 완료';wb.classList.add('done');}
  else{wb.textContent='👁 시청 완료';wb.classList.remove('done');}

  // 같은 회차 다른 영상
  const same=filtered.filter((_,j)=>j!==i).slice(0,5);
  document.getElementById('p-next').innerHTML=same.map((n,j)=>{
    const ni=filtered.indexOf(n);
    return `<div class="pn-item" onclick="play(${ni})">
      <img src="${n.thumbnail_url||'https://img.youtube.com/vi/'+n.video_id+'/mqdefault.jpg'}" loading="lazy">
      <div><div class="t">${n.title}</div><div class="m">${n.channel_name} · ▶${fmt(n.view_count)}</div></div>
    </div>`;
  }).join('');
  document.getElementById('player').classList.add('active');
  document.body.style.overflow='hidden';
}

function toggleWatched(){
  if(!curVid)return;
  const wb=document.getElementById('p-btn');
  if(isW(curVid)){unmarkW(curVid);wb.textContent='👁 시청 완료';wb.classList.remove('done');}
  else{markW(curVid);wb.textContent='✓ 시청 완료';wb.classList.add('done');}
}

function closePlayer(){
  document.getElementById('player').classList.remove('active');
  document.getElementById('p-iframe').src='';
  document.body.style.overflow='';
  curVid=null; apply();
}

load();
</script>
</body>
</html>
